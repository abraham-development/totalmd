[package]
name = "totalmd"
version = "0.2.4"
description = "Visor y editor de Markdown con soporte completo para diagramas Mermaid"
authors = ["Abraham"]
license = "MIT"
repository = "https://github.com/abraham-development/totalmd"
edition = "2021"

[lib]
name = "totalmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
base64 = "0.22"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["time", "sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# webkit2gtk/gtk: impresión y PDF (print.rs); gio/cairo: capturas de depuración (TOTALMD_SNAPSHOT_DIR). Ya forman parte del árbol de wry.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"
gio = "0.18"
cairo-rs = { version = "0.18", features = ["png"] }
